name: Update RSI data
 
on:
  schedule:
    - cron: "7 * * * *"     # every hour, 7 minutes past
  workflow_dispatch:         # adds a "Run workflow" button for manual runs
 
permissions:
  contents: write
 
concurrency:                 # never push at the same time as the slow data job
  group: data-commit
  cancel-in-progress: false
 
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python fetch_rsi.py
      - name: Commit rsi.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add rsi.json
          git diff --staged --quiet && exit 0
          git commit -m "Update RSI data"
          git pull --rebase
          git push
 

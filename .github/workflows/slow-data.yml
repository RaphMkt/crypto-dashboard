name: Update slow data
 
on:
  schedule:
    - cron: "15 20 * * *"   # early morning in Sydney
    - cron: "15 4 * * *"    # early afternoon in Sydney (retries anything that failed)
    - cron: "15 12 * * *"   # late evening in Sydney
  workflow_dispatch:         # adds a "Run workflow" button for manual runs
 
permissions:
  contents: write
 
concurrency:                 # never push at the same time as the RSI job
  group: data-commit
  cancel-in-progress: false
 
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytrends pandas
      - run: python fetch_slow.py
      - name: Commit slow.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add slow.json
          git diff --staged --quiet && exit 0
          git commit -m "Update slow data"
          git pull --rebase
          git push
 
